<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title: Restaurant Menu -->
    <title>Restaurant Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            margin: 30px;
            color: #333;
        }

        .menu-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Table styling */
        table {
            width: 100%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        /* Caption element styling matching slide design */
        caption {
            font-size: 1.4rem;
            font-weight: bold;
            color: #881337;
            padding: 12px;
            background-color: #ffe4e6;
            border: 1px solid #fecdd3;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            caption-side: top;
        }

        /* Table Headers */
        th {
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 1.05rem;
            font-weight: bold;
        }

        /* Category background colors matching the image */
        .starters-bg {
            background-color: #ffedd5;
            color: #9a3412;
            font-weight: bold;
        }

        .maincourse-bg {
            background-color: #dcfce7;
            color: #166534;
            font-weight: bold;
        }

        .desserts-bg {
            background-color: #ffe4e6;
            color: #9f1239;
            font-weight: bold;
        }

        .drinks-bg {
            background-color: #e0f2fe;
            color: #075985;
            font-weight: bold;
        }

        td {
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- 
          Requirements Met:
          - Title: Restaurant Menu
          - Table attributes: border, cellpadding, cellspacing, align
          - Table features: rowspan, caption
          - Categories: Starters, Main Course, Desserts, Drinks (each with at least 3 items)
        -->
        <table border="1" cellpadding="10" cellspacing="0" align="center">
            <!-- <caption> tag used for table title -->
            <caption>Today's Special Menu</caption>
            
            <thead>
                <tr>
                    <th width="25%">Category</th>
                    <th width="50%">Food Item</th>
                    <th width="25%">Price (₹)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 1. STARTERS (rowspan="3") -->
                <tr>
                    <td rowspan="3" align="center" class="starters-bg">Starters</td>
                    <td align="left">Spring Rolls</td>
                    <td align="center">120</td>
                </tr>
                <tr>
                    <td align="left">Garlic Bread</td>
                    <td align="center">100</td>
                </tr>
                <tr>
                    <td align="left">Veg Soup</td>
                    <td align="center">80</td>
                </tr>

                <!-- 2. MAIN COURSE (rowspan="3") -->
                <tr>
                    <td rowspan="3" align="center" class="maincourse-bg">Main Course</td>
                    <td align="left">Paneer Butter Masala</td>
                    <td align="center">180</td>
                </tr>
                <tr>
                    <td align="left">Veg Biryani</td>
                    <td align="center">150</td>
                </tr>
                <tr>
                    <td align="left">Dal Tadka</td>
                    <td align="center">120</td>
                </tr>

                <!-- 3. DESSERTS (rowspan="3") -->
                <tr>
                    <td rowspan="3" align="center" class="desserts-bg">Desserts</td>
                    <td align="left">Chocolate Cake</td>
                    <td align="center">90</td>
                </tr>
                <tr>
                    <td align="left">Ice Cream</td>
                    <td align="center">70</td>
                </tr>
                <tr>
                    <td align="left">Gulab Jamun</td>
                    <td align="center">60</td>
                </tr>

                <!-- 4. DRINKS (rowspan="3") -->
                <tr>
                    <td rowspan="3" align="center" class="drinks-bg">Drinks</td>
                    <td align="left">Fresh Lime Soda</td>
                    <td align="center">50</td>
                </tr>
                <tr>
                    <td align="left">Cold Coffee</td>
                    <td align="center">80</td>
                </tr>
                <tr>
                    <td align="left">Mango Shake</td>
                    <td align="center">70</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
